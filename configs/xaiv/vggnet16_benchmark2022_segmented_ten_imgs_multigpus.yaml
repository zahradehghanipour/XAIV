dataset:
  type: "imagenet_vggnet16"          
  root: "benchmarks/vggnet16_benchmark2022/imagenet-sample"

  # still keep these for grid mode
  grid_size: 6
  iou_threshold: 0.8
  score_threshold: 0.0
  max_segments: 5

segmentation:
  model_name: "facebook/sam2-hiera-large"
  device: "auto"        # "auto", "cpu" or "cuda"
  prompt_mode: "grid"     # "grid" or "manual"
  prompts_path: "benchmarks/points/"

  grid_size: 6
  iou_threshold: 0.8
  score_threshold: 0.0
  max_segments: 1

  vis: False  

verification:
  epsilon: [0.0001] 
  dilation_radius: 0
  num_classes: 1000

  perturb_pixels: [10, 20]
  perturb_select: "random"
  perturb_seed: 0

onnx:
  source_model: "benchmarks/vggnet16_benchmark2022/onnx/vgg16-7.onnx"
  target_name: "vgg16-7.onnx"

output:
  benchmark_dir: "/projects/air/dlverifier/vggnet16_ten_imgs_multigpus"
  timeout: 1200

run:
  indices: [251,252,253,254,255,256,257,258,259,260]

  # image_paths: []
    # Directory will be expanded to image files by pipeline.py
    # - "benchmarks/vggnet16_benchmark2022/imagenet-sample"
