dataset:
  type: "imagenet_vggnet16"          
  root: "benchmarks/vggnet16_benchmark2022/imagenet-sample"

segmentation:
  model_name: "facebook/sam2-hiera-large"
  device: "auto"        # "auto", "cpu" or "cuda"
  grid_size: 6
  iou_threshold: 0.8
  score_threshold: 0.0
  max_segments: 1

verification:
  epsilon: [0.0001, 0.0003, 0.0005, 0.0007, 0.001, 0.005, 0.01] 
  dilation_radius: 0
  num_classes: 1000     # ImageNet-1k

  perturb_pixels: [15, 30, 45, 60, 75, 90, 105, 120, 135, 151, 301, 452, 602, 753, 903, 1054, 1204, 1355, 1505, 3011, 4516, 6021, 7526, 9032, 10537, 12042, 13548, 15053, 30106, 45158, 60211, 75264, 90317, 105370, 120422, 135475]
  perturb_select: "random"   # "random" for now
  perturb_seed: 0

onnx:
  source_model: "benchmarks/vggnet16_benchmark2022/onnx/vgg16-7.onnx"
  target_name: "vgg16-7.onnx"

output:
  benchmark_dir: "benchmarks/vggnet16_benchmark2022_segmented/"
  timeout: 1200

run:
  # Option 1: process images by index (sorted over all sample images)
  indices: [15]

  # Option 2: explicit paths (leave empty if using indices)
  image_paths:
    # Directory will be expanded to image files by pipeline.py
    # - "benchmarks/vggnet16_benchmark2022/imagenet-sample"
