dataset:
  type: "imagenet_vggnet16"          
  root: "benchmarks/vggnet16_benchmark2022/imagenet-sample"

  # still keep these for grid mode
  grid_size: 6
  iou_threshold: 0.8
  score_threshold: 0.0
  max_segments: 5

segmentation:
  model_name: "facebook/sam2-hiera-large"
  device: "auto"        # "auto", "cpu" or "cuda"
  prompt_mode: "grid"     # "grid" or "manual"
  prompts_path: "benchmarks/points/"

  grid_size: 6
  iou_threshold: 0.8
  score_threshold: 0.0
  max_segments: 1

  vis: False  

verification:
  epsilon: [0.0001] 
  dilation_radius: 0
  num_classes: 1000

  perturb_pixels: [50176, 25088, 12544, 6272, 3136, 1568]
  perturb_select: "random"
  perturb_seed: 0

onnx:
  source_model: "benchmarks/vggnet16_benchmark2022/onnx/vgg16-7.onnx"
  target_name: "vgg16-7.onnx"

output:
  benchmark_dir: "/projects/air/dlverifier/vggnet16_251_300_imgs"
  timeout: 1200

run:
  # Option 1: process images by index (sorted over all sample images)
  # indices: [201,202,203,204,205,206,207,208,209,210,
  # 211,212,213,214,215,216,217,218,219,220,
  # 221,222,223,224,225,226,227,228,229,230,
  # 231,232,233,234,235,236,237,238,239,240,
  # 241,242,243,244,245,246,247,248,249,250]

  indices: [251,252,253,254,255,256,257,258,259,260,
  261,262,263,264,265,266,267,268,269,270,
  271,272,273,274,275,276,277,278,279,280,
  281,282,283,284,285,286,287,288,289,290,
  291,292,293,294,295,296,297,298,299,300]



  image_paths: []
